openapi: 3.1.0
info:
  title: NeNe Corpus API
  version: 0.9.0
  description: >
    NeNe Corpus public API contract — self-hosted knowledge chat on NENE2.
    Phase 2 adds consumer sync JSON chat with citations.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: System
    description: Runtime health endpoints.
  - name: Admin
    description: Admin authentication for mutating routes.
  - name: Ingestion
    description: CSV and PDF upload, preview, and ingestion.
  - name: Chat
    description: Consumer sync JSON chat with citations.
  - name: AdminChat
    description: Admin read-only access to consumer chat logs.
  - name: Install
    description: First-time web installer for Tier A deployments.
paths:
  /install/status:
    get:
      tags:
        - Install
      summary: Install status and detected public paths
      description: Returns whether NeNe Corpus is installed and the detected base path for embed assets.
      operationId: getInstallStatus
      responses:
        '200':
          description: Install status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallStatusResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /install:
    post:
      tags:
        - Install
      summary: Run first-time install
      description: Writes `.env`, runs migrations, creates the first admin user, and locks the installer.
      operationId: runInstall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInstallRequest'
      responses:
        '201':
          description: Install completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInstallResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      tags:
        - System
      summary: Health endpoint
      description: Operational health check (NENE2 runtime).
      operationId: getHealth
      responses:
        '200':
          description: Healthy response (no checks configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  summary: Healthy response
                  value:
                    status: ok
                    service: NENE2
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/auth/login:
    post:
      tags:
        - Admin
      summary: Admin login
      description: Issue a Bearer JWT for admin routes. Requires `NENE2_LOCAL_JWT_SECRET` on the server.
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAdminRequest'
            examples:
              valid:
                value:
                  email: admin@example.com
                  password: secret-password
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAdminResponse'
              examples:
                ok:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                    token_type: Bearer
                    expires_at: '2026-05-25T13:00:00+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/auth/me:
    get:
      tags:
        - Admin
      summary: Current admin profile
      description: Returns JWT claims for the authenticated admin.
      operationId: getAdminMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin profile from JWT claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
              examples:
                ok:
                  value:
                    id: 1
                    email: admin@example.com
                    role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/appearance:
    get:
      tags:
        - Admin
      summary: Get widget appearance settings
      description: Returns operator-configured embed widget theme and default locale.
      operationId: getAppearanceSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current appearance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Admin
      summary: Update widget appearance settings
      description: Saves embed widget theme CSS variables and optional default locale.
      operationId: updateAppearanceSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppearanceSettingsRequest'
      responses:
        '200':
          description: Updated appearance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/appearance/hero-image:
    post:
      tags:
        - Admin
      summary: Upload HERO image
      description: Stores a JPEG, PNG, or WebP image (max 2 MB) and returns its public path. Does not update appearance settings until PUT /admin/appearance.
      operationId: uploadHeroImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadHeroImageRequest'
      responses:
        '201':
          description: Stored hero image path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadHeroImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/appearance/avatar-image:
    post:
      tags:
        - Admin
      summary: Upload assistant avatar image
      description: Stores a JPEG, PNG, or WebP image (max 2 MB) and returns its public path. Does not update appearance settings until PUT /admin/appearance.
      operationId: uploadAvatarImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAvatarImageRequest'
      responses:
        '201':
          description: Stored avatar image path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAvatarImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /media/hero/{filename}:
    get:
      tags:
        - System
      summary: Serve HERO image
      description: Returns a stored hero image file. No authentication.
      operationId: serveHeroImage
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hero image bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /media/avatar/{filename}:
    get:
      tags:
        - System
      summary: Serve assistant avatar image
      description: Returns a stored assistant avatar image file. No authentication.
      operationId: serveAvatarImage
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Avatar image bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /widget/appearance:
    get:
      tags:
        - System
      summary: Public widget appearance
      description: Read-only appearance settings for the embed widget bundle. No authentication.
      operationId: getWidgetAppearance
      responses:
        '200':
          description: Widget appearance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettingsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/ingestion/csv/preview:
    post:
      tags:
        - Ingestion
      summary: Preview CSV columns
      description: Parse CSV headers and sample rows for column mapping UI. No database writes.
      operationId: previewCsvIngestion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewCsvIngestionRequest'
      responses:
        '200':
          description: Parsed CSV preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewCsvIngestionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/ingestion/pdf/preview:
    post:
      tags:
        - Ingestion
      summary: Preview PDF text
      description: Extract page count and sample text from a text-based PDF. No database writes.
      operationId: previewPdfIngestion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewPdfIngestionRequest'
      responses:
        '200':
          description: Parsed PDF preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewPdfIngestionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sources:
    get:
      tags:
        - Ingestion
      summary: List sources
      description: Paginated list of corpus sources with ingestion status and document/chunk counts.
      operationId: listSources
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Source list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Ingestion
      summary: Create source
      description: Store uploaded file and sync parse into documents and chunks. Supports CSV and text PDF.
      operationId: createSource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created and ingested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sources/{id}:
    delete:
      tags:
        - Ingestion
      summary: Delete source
      description: Soft delete a source and its documents; remove associated chunks.
      operationId: deleteSourceById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Source deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sources/{id}/reindex:
    post:
      tags:
        - Ingestion
      summary: Reindex source
      description: Rebuild documents and chunks from the stored upload file. CSV sources may optionally override column mapping.
      operationId: reindexSourceById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReindexSourceRequest'
      responses:
        '200':
          description: Source reindexed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/chat/sessions:
    get:
      tags:
        - AdminChat
      summary: List chat sessions
      description: Paginated consumer chat sessions with message counts for the admin conversation log.
      operationId: listChatSessions
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Chat session list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChatSessionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/chat/sessions/{id}/messages:
    get:
      tags:
        - AdminChat
      summary: List chat messages
      description: Messages for a consumer chat session, including citations on assistant replies.
      operationId: listChatSessionMessages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Chat messages for the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListChatSessionMessagesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ChatSessionNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /chat/sessions:
    post:
      tags:
        - Chat
      summary: Create chat session
      description: Issue a consumer session token for sync JSON chat. Never use admin JWT.
      operationId: createChatSession
      responses:
        '201':
          description: Chat session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatSessionResponse'
              examples:
                ok:
                  value:
                    session_id: 1
                    session_token: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        '500':
          $ref: '#/components/responses/InternalServerError'
  /chat/messages:
    post:
      tags:
        - Chat
      summary: Send chat message
      description: >
        Sync JSON chat — POST a user message and receive the full assistant reply with citations.
        Requires `X-Session-Token` from `POST /chat/sessions`.
      operationId: sendChatMessage
      parameters:
        - name: X-Session-Token
          in: header
          required: true
          schema:
            type: string
          description: Consumer session token (`session_token` from session creation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
            examples:
              question:
                value:
                  content: Which products pair well with seafood?
      responses:
        '200':
          description: Assistant reply with citations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
              examples:
                ok:
                  value:
                    message_id: 2
                    session_id: 1
                    role: assistant
                    content: Here is an answer grounded in the corpus search results.
                    citations:
                      - chunk_id: 10
                        document_id: 3
                        source_id: 1
                        excerpt: Pairing guide for dry ginjo and white fish.
                        page_number: 2
                        section_label: Pairings
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '404':
          $ref: '#/components/responses/ChatSessionNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 admin JWT from `POST /admin/auth/login`.
    sessionTokenAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Consumer session token from `POST /chat/sessions`. Not admin JWT.
  responses:
    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            internal:
              value:
                type: https://nene-corpus.dev/problems/internal-server-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred.
                instance: /health
    Unauthorized:
      description: Missing or invalid Bearer token, or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthorized:
              value:
                type: https://nene-corpus.dev/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Invalid email or password.
                instance: /admin/auth/login
    ValidationFailed:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            validationFailed:
              value:
                type: https://nene-corpus.dev/problems/validation-failed
                title: Validation Failed
                status: 422
                detail: The request body contains invalid values.
                errors:
                  - field: email
                    message: Email is required.
                    code: required
    BadRequest:
      description: Install or request failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Install already completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SourceNotFound:
      description: Source not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            sourceNotFound:
              value:
                type: https://nene-corpus.dev/problems/source-not-found
                title: Not Found
                status: 404
                detail: The requested source was not found.
                instance: /admin/sources/999
    ChatSessionNotFound:
      description: Chat session not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            chatSessionNotFound:
              value:
                type: https://nene-corpus.dev/problems/chat-session-not-found
                title: Not Found
                status: 404
                detail: The requested chat session was not found.
                instance: /chat/messages
    RateLimitExceeded:
      description: Chat session or IP rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Unix timestamp when the window resets.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            rateLimitExceeded:
              value:
                type: https://nene-corpus.dev/problems/rate-limit-exceeded
                title: Too Many Requests
                status: 429
                detail: Chat session rate limit exceeded.
                instance: /chat/messages
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
    InstallStatusResponse:
      type: object
      required:
        - installed
        - base_path
        - paths
      properties:
        installed:
          type: boolean
        base_path:
          type: string
        paths:
          $ref: '#/components/schemas/PublicPathsResponse'
    PublicPathsResponse:
      type: object
      required:
        - base_path
        - widget_script_src
        - widget_css_href
        - api_base
      properties:
        base_path:
          type: string
        widget_script_src:
          type: string
        widget_css_href:
          type: string
        api_base:
          type: string
    RunInstallRequest:
      type: object
      required:
        - database
        - admin
      properties:
        base_path:
          type: string
        database:
          type: object
          required:
            - adapter
            - name
          properties:
            adapter:
              type: string
              enum:
                - mysql
                - sqlite
            host:
              type: string
            port:
              type: integer
            name:
              type: string
            user:
              type: string
            password:
              type: string
            charset:
              type: string
            environment:
              type: string
        admin:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              format: password
        anthropic_api_key:
          type: string
    RunInstallResponse:
      type: object
      required:
        - installed
        - admin_email
        - base_path
      properties:
        installed:
          type: boolean
        admin_email:
          type: string
          format: email
        base_path:
          type: string
    LoginAdminRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginAdminResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_at
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_at:
          type: string
          format: date-time
    AdminMeResponse:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
    WidgetTheme:
      type: object
      required:
        - color_primary
        - color_surface
        - color_text
        - radius_md
        - max_width
      properties:
        color_primary:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#2563eb'
        color_surface:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#ffffff'
        color_text:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#1f2937'
        radius_md:
          type: string
          example: 0.5rem
        max_width:
          type: string
          example: 100%
          description: Maximum width of the embed widget (CSS length, e.g. 480px or 100%).
    WidgetHero:
      type: object
      required:
        - title
        - description
        - cta_label
        - show_title
        - show_description
        - show_cta
        - show_image
      properties:
        title:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Welcome title when `show_title` is true. Null uses widget i18n default.
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Welcome description when `show_description` is true. Null uses widget i18n default.
        cta_label:
          type:
            - string
            - 'null'
          maxLength: 40
          description: CTA label when `show_cta` is true. Null uses widget i18n default.
        show_title:
          type: boolean
          default: true
          description: When false, the welcome title is hidden.
        show_description:
          type: boolean
          default: true
          description: When false, the welcome description is hidden.
        show_cta:
          type: boolean
          default: true
          description: When false, the CTA button is hidden.
        show_image:
          type: boolean
          default: true
          description: When false, the hero image is hidden.
        image_url:
          type:
            - string
            - 'null'
          description: Public path to a stored hero image (e.g. /media/hero/abc123_logo.png). Null when no image is configured.
        image_alt:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Optional alt text for the hero image.
    WidgetChat:
      type: object
      required:
        - user_avatar_mode
        - show_assistant_avatar
      properties:
        user_avatar_mode:
          type: string
          enum:
            - silhouette
            - none
          default: silhouette
          description: User message avatar display. `silhouette` shows a generic icon; `none` hides it.
        show_assistant_avatar:
          type: boolean
          default: true
          description: When false, the assistant avatar is hidden in chat bubbles.
        assistant_avatar_url:
          type:
            - string
            - 'null'
          description: Public path to a stored assistant avatar (e.g. /media/avatar/abc123_bot.png). Null uses the default silhouette.
        assistant_avatar_alt:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Optional alt text for the assistant avatar image.
