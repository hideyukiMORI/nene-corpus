        - daily_requests_global
        - daily_tokens_per_ip
        - daily_tokens_global
      properties:
        max_message_chars:
          type: integer
          minimum: 0
          description: Max characters per user message. 0 = no limit.
        message_interval_seconds:
          type: integer
          minimum: 0
          description: Minimum seconds between messages in the same session. 0 = no limit.
        session_requests_per_hour:
          type: integer
          minimum: 0
          description: Max requests per session per hour. 0 = no limit.
        ip_requests_per_hour:
          type: integer
          minimum: 0
          description: Max requests per IP per hour. 0 = no limit.
        daily_requests_per_ip:
          type: integer
          minimum: 0
          description: Max requests per IP per rolling 24 h. 0 = no limit.
        daily_requests_global:
          type: integer
          minimum: 0
          description: Max requests across all IPs per rolling 24 h. 0 = no limit.
        daily_tokens_per_ip:
          type: integer
          minimum: 0
          description: Max combined input+output tokens per IP per rolling 24 h. 0 = no limit.
        daily_tokens_global:
          type: integer
          minimum: 0
          description: Max combined input+output tokens across all IPs per rolling 24 h. 0 = no limit.
