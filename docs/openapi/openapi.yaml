        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 admin JWT from `POST /admin/auth/login`.
    sessionTokenAuth:
      type: apiKey
      in: header
      name: X-Session-Token
      description: Consumer session token from `POST /chat/sessions`. Not admin JWT.
  responses:
    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            internal:
              value:
                type: https://nene-corpus.dev/problems/internal-server-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred.
                instance: /health
    Unauthorized:
      description: Missing or invalid Bearer token, or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthorized:
              value:
                type: https://nene-corpus.dev/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Invalid email or password.
                instance: /admin/auth/login
    ValidationFailed:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            validationFailed:
              value:
                type: https://nene-corpus.dev/problems/validation-failed
                title: Validation Failed
                status: 422
                detail: The request body contains invalid values.
                errors:
                  - field: email
                    message: Email is required.
                    code: required
    BadRequest:
      description: Install or request failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Install already completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    SourceNotFound:
      description: Source not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            sourceNotFound:
              value:
                type: https://nene-corpus.dev/problems/source-not-found
                title: Not Found
                status: 404
                detail: The requested source was not found.
                instance: /admin/sources/999
    DocumentNotFound:
      description: Document not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            documentNotFound:
              value:
                type: https://nene-corpus.dev/problems/document-not-found
                title: Not Found
                status: 404
                detail: The requested document was not found.
                instance: /admin/documents/999
    ChatSessionNotFound:
      description: Chat session not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            chatSessionNotFound:
              value:
                type: https://nene-corpus.dev/problems/chat-session-not-found
                title: Not Found
                status: 404
                detail: The requested chat session was not found.
                instance: /chat/messages
    RateLimitExceeded:
      description: Chat session or IP rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds until the client may retry.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Unix timestamp when the window resets.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            rateLimitExceeded:
              value:
                type: https://nene-corpus.dev/problems/rate-limit-exceeded
                title: Too Many Requests
                status: 429
                detail: Chat session rate limit exceeded.
                instance: /chat/messages
  schemas:
    TenantResolutionMode:
      type: string
      enum:
        - single
        - subdomain
        - path
      description: >
        テナント解決方式。
        `single` = シングルテナント（org_slug で固定）、
        `subdomain` = サブドメインでテナント判定（将来拡張）、
        `path` = URL パスプレフィックスでテナント判定（将来拡張）。
    SystemConfig:
      type: object
      properties:
        tenant_resolution_mode:
          $ref: '#/components/schemas/TenantResolutionMode'
        tenant_org_slug:
          type: string
          nullable: true
          description: single モード時に使用する組織スラッグ。
          example: default
        tenant_base_domain:
          type: string
          nullable: true
          description: subdomain モード時のベースドメイン。
          example: example.com
    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - plan
        - is_active
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: 組織の表示名。
          example: Acme Inc.
        slug:
          type: string
          description: URL セーフな一意識別子。
          example: acme
        custom_domain:
          type: string
          nullable: true
          description: サブドメインモード用のカスタムドメイン。
          example: chat.acme.com
        plan:
          type: string
          enum:
            - free
            - pro
            - enterprise
          description: 課金プラン。
          example: free
        is_active:
          type: boolean
          description: 組織が有効かどうか。
          example: true
        external_id:
          type: string
          nullable: true
          description: NeNe Records 連携用の外部 ID。
          example: nene-records-org-abc123
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateOrganizationRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          description: 組織の表示名。
          example: Acme Inc.
        slug:
          type: string
          description: URL セーフな一意識別子（英数字とハイフンのみ）。
          example: acme
        custom_domain:
          type: string
          nullable: true
          description: サブドメインモード用のカスタムドメイン。
          example: chat.acme.com
        plan:
          type: string
          enum:
            - free
            - pro
            - enterprise
          default: free
        is_active:
          type: boolean
          default: true
        external_id:
          type: string
          nullable: true
          description: NeNe Records 連携用の外部 ID。
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          description: 組織の表示名。
          example: Acme Inc.
        custom_domain:
          type: string
          nullable: true
          description: サブドメインモード用のカスタムドメイン。
        plan:
          type: string
          enum:
            - free
            - pro
            - enterprise
        is_active:
          type: boolean
        external_id:
          type: string
          nullable: true
          description: NeNe Records 連携用の外部 ID。
    ListOrganizationsResponse:
      type: object
      required:
        - organizations
        - total
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        total:
          type: integer
          format: int64
          description: フィルタ適用後の総件数。
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
    InstallStatusResponse:
      type: object
      required:
        - installed
        - base_path
        - paths
      properties:
        installed:
          type: boolean
        base_path:
          type: string
        paths:
          $ref: '#/components/schemas/PublicPathsResponse'
    PublicPathsResponse:
      type: object
      required:
        - base_path
        - widget_script_src
        - widget_css_href
        - api_base
      properties:
        base_path:
          type: string
        widget_script_src:
          type: string
        widget_css_href:
          type: string
        api_base:
          type: string
    RunInstallRequest:
      type: object
      required:
        - database
        - admin
      properties:
        base_path:
          type: string
        database:
          type: object
          required:
            - adapter
            - name
          properties:
            adapter:
              type: string
              enum:
                - mysql
                - sqlite
            host:
              type: string
            port:
              type: integer
            name:
              type: string
            user:
              type: string
            password:
              type: string
            charset:
              type: string
            environment:
              type: string
        admin:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              format: password
        anthropic_api_key:
          type: string
    RunInstallResponse:
      type: object
      required:
        - installed
        - admin_email
        - base_path
      properties:
        installed:
          type: boolean
        admin_email:
          type: string
          format: email
        base_path:
          type: string
    LoginAdminRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginAdminResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_at
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_at:
          type: string
          format: date-time
    AdminMeResponse:
      type: object
