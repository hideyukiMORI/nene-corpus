openapi: 3.1.0
info:
  title: NeNe Corpus API
  version: 0.9.0
  description: >
    NeNe Corpus public API contract — self-hosted knowledge chat on NENE2.
    Phase 2 adds consumer sync JSON chat with citations.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: System
    description: Runtime health endpoints.
  - name: Admin
    description: Admin authentication for mutating routes.
  - name: Ingestion
    description: CSV and PDF upload, preview, and ingestion.
  - name: Chat
    description: Consumer sync JSON chat with citations.
  - name: AdminChat
    description: Admin read-only access to consumer chat logs.
  - name: Install
    description: First-time web installer for Tier A deployments.
  - name: Superadmin
    description: スーパー管理者専用の操作。テナント解決方式の切替・組織の CRUD。
paths:
  /install/status:
    get:
      tags:
        - Install
      summary: Install status and detected public paths
      description: Returns whether NeNe Corpus is installed and the detected base path for embed assets.
      operationId: getInstallStatus
      responses:
        '200':
          description: Install status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallStatusResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /install:
    post:
      tags:
        - Install
      summary: Run first-time install
      description: Writes `.env`, runs migrations, creates the first admin user, and locks the installer.
      operationId: runInstall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunInstallRequest'
      responses:
        '201':
          description: Install completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunInstallResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      tags:
        - System
      summary: Health endpoint
      description: Operational health check (NENE2 runtime).
      operationId: getHealth
      responses:
        '200':
          description: Healthy response (no checks configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  summary: Healthy response
                  value:
                    status: ok
                    service: NENE2
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/auth/login:
    post:
      tags:
        - Admin
      summary: Admin login
      description: Issue a Bearer JWT for admin routes. Requires `NENE2_LOCAL_JWT_SECRET` on the server.
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAdminRequest'
            examples:
              valid:
                value:
                  email: admin@example.com
                  password: secret-password
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAdminResponse'
              examples:
                ok:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                    token_type: Bearer
                    expires_at: '2026-05-25T13:00:00+00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/auth/me:
    get:
      tags:
        - Admin
      summary: Current admin profile
      description: Returns JWT claims for the authenticated admin.
      operationId: getAdminMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin profile from JWT claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMeResponse'
              examples:
                ok:
                  value:
                    id: 1
                    email: admin@example.com
                    role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/auth/password:
    put:
      tags:
        - Admin
      summary: Change admin password
      description: Changes the authenticated admin's password. Requires current password verification.
      operationId: changeAdminPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAdminPasswordRequest'
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/auth/email:
    put:
      tags:
        - Admin
      summary: Change admin email
      description: Changes the authenticated admin's email address. Requires current password verification.
      operationId: changeAdminEmail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAdminEmailRequest'
      responses:
        '200':
          description: Email changed successfully.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/auth/password-reset/request:
    post:
      tags:
        - Admin
      summary: Request password reset
      description: |
        Sends a password reset link to the given email if it belongs to a registered admin.
        Always returns 200 regardless of whether the email exists (enumeration prevention).
        Requires SMTP to be configured; if not, silently succeeds.
      operationId: requestAdminPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
      responses:
        '200':
          description: Reset link sent (or silently skipped if email not found or SMTP not configured).
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: If the email address is registered, a reset link has been sent.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/auth/password-reset/confirm:
    post:
      tags:
        - Admin
      summary: Confirm password reset
      description: Validates the reset token from the email link and sets a new password.
      operationId: confirmAdminPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Raw reset token from the email link query parameter.
                password:
                  type: string
                  minLength: 8
                  description: New password (minimum 8 characters).
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Password has been reset successfully. Please log in with your new password.
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/settings/llm:
    get:
      tags:
        - Admin
      summary: Get LLM settings
      description: Returns masked Anthropic API key status, model, and max tokens. Never returns the full API key.
      operationId: getLlmSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current LLM settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Admin
      summary: Update LLM settings
      description: Validates connectivity, then updates ANTHROPIC_* values in `.env`. Omit or empty `api_key` to keep the current key.
      operationId: updateLlmSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLlmSettingsRequest'
      responses:
        '200':
          description: Updated LLM settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/settings/chat:
    get:
      tags:
        - Admin
      summary: Get chat settings
      description: Returns the current custom system prompt and fallback message, plus the built-in defaults.
      operationId: getChatSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current chat settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Admin
      summary: Update chat settings
      description: Saves a custom system prompt and/or fallback message. Pass null to reset to the built-in default.
      operationId: updateChatSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatSettingsRequest'
      responses:
        '200':
          description: Updated chat settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/settings/limits:
    get:
      tags:
        - Admin
      summary: Get chat limits settings
      description: Returns the current chat abuse-prevention and cost-control limits. All values are non-negative integers; 0 means no limit.
      operationId: getChatLimitsSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current chat limits settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatLimitsSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Admin
      summary: Update chat limits settings
      description: Saves chat limits. All fields are required. Pass 0 to disable a limit.
      operationId: updateChatLimitsSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChatLimitsSettingsRequest'
      responses:
        '200':
          description: Updated chat limits settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatLimitsSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/settings/llm/test:
    post:
      tags:
        - Admin
      summary: Test LLM connectivity
      description: Sends a lightweight Anthropic Messages API request. Optional `api_key` tests a draft key before save.
      operationId: testLlmConnection
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestLlmConnectionRequest'
      responses:
        '200':
          description: Connection succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestLlmConnectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/notifications/settings:
    get:
      tags:
        - Admin
      summary: Get notification settings
      operationId: getNotificationSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current notification settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Admin
      summary: Update notification settings
      operationId: updateNotificationSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationSettingsRequest'
      responses:
        '200':
          description: Updated notification settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/notifications/test-mail:
    post:
      tags:
        - Admin
      summary: Send a test email
      operationId: sendTestMail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Test email sent successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          description: Mail send failed.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/notifications/daily-report:
    get:
      tags:
        - Admin
      summary: Send daily chat report email (cron endpoint)
      description: Public endpoint protected by a secret token. Intended to be called by an external cron service or server cron job.
      operationId: sendDailyReport
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          description: Target date in Y-m-d format. Defaults to today.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Daily report sent successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Report disabled or misconfigured.
        '502':
          description: Mail send failed.
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/appearance:
    get:
      tags:
        - Admin
      summary: Get widget appearance settings
      description: Returns operator-configured embed widget theme and default locale.
      operationId: getAppearanceSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current appearance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Admin
      summary: Update widget appearance settings
      description: Saves embed widget theme CSS variables and optional default locale.
      operationId: updateAppearanceSettings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppearanceSettingsRequest'
      responses:
        '200':
          description: Updated appearance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/appearance/hero-image:
    post:
      tags:
        - Admin
      summary: Upload HERO image
      description: Stores a JPEG, PNG, or WebP image (max 2 MB) and returns its public path. Does not update appearance settings until PUT /admin/appearance.
      operationId: uploadHeroImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadHeroImageRequest'
      responses:
        '201':
          description: Stored hero image path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadHeroImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/appearance/avatar-image:
    post:
      tags:
        - Admin
      summary: Upload assistant avatar image
      description: Stores a JPEG, PNG, or WebP image (max 2 MB) and returns its public path. Does not update appearance settings until PUT /admin/appearance.
      operationId: uploadAvatarImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAvatarImageRequest'
      responses:
        '201':
          description: Stored avatar image path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAvatarImageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /media/hero/{filename}:
    get:
      tags:
        - System
      summary: Serve HERO image
      description: Returns a stored hero image file. No authentication.
      operationId: serveHeroImage
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hero image bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /media/avatar/{filename}:
    get:
      tags:
        - System
      summary: Serve assistant avatar image
      description: Returns a stored assistant avatar image file. No authentication.
      operationId: serveAvatarImage
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Avatar image bytes.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /widget/appearance:
    get:
      tags:
        - System
      summary: Public widget appearance
      description: Read-only appearance settings for the embed widget bundle. No authentication.
      operationId: getWidgetAppearance
      responses:
        '200':
          description: Widget appearance settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettingsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/ingestion/csv/preview:
    post:
      tags:
        - Ingestion
      summary: Preview CSV columns
      description: Parse CSV headers and sample rows for column mapping UI. No database writes.
      operationId: previewCsvIngestion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewCsvIngestionRequest'
      responses:
        '200':
          description: Parsed CSV preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewCsvIngestionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/ingestion/pdf/preview:
    post:
      tags:
        - Ingestion
      summary: Preview PDF text
      description: Extract page count and sample text from a text-based PDF. No database writes.
      operationId: previewPdfIngestion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewPdfIngestionRequest'
      responses:
        '200':
          description: Parsed PDF preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewPdfIngestionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sources:
    get:
      tags:
        - Ingestion
      summary: List sources
      description: Paginated list of corpus sources with ingestion status and document/chunk counts.
      operationId: listSources
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: Source list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSourcesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Ingestion
      summary: Create source
      description: Store uploaded file and sync parse into documents and chunks. Supports CSV and text PDF.
      operationId: createSource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created and ingested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sources/{id}:
    delete:
      tags:
        - Ingestion
      summary: Delete source
      description: Soft delete a source and its documents; remove associated chunks.
      operationId: deleteSourceById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Source deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SourceNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sources/{id}/reindex:
    post:
      tags:
        - Ingestion
      summary: Reindex source
      description: Rebuild documents and chunks from the stored upload file. CSV sources may optionally override column mapping.
      operationId: reindexSourceById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReindexSourceRequest'
      responses:
        '200':
          description: Source reindexed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSourceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/sources/{sourceId}/documents:
