    WidgetTheme:
      type: object
      required:
        - color_primary
        - color_surface
        - color_text
        - radius_panel
        - radius_control
        - max_width
      properties:
        color_primary:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#2563eb'
        color_surface:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#ffffff'
        color_text:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#1f2937'
        radius_panel:
          type: string
          example: 0.5rem
          description: Border radius of the chat panel outer frame.
        radius_control:
          type: string
          example: 0.5rem
          description: Border radius of inputs, buttons, bubbles, and hero controls.
        radius_md:
          type: string
          deprecated: true
          description: Legacy alias; use radius_panel and radius_control. Accepted on write as fallback only.
        max_width:
          type: string
          example: 100%
          description: Maximum width of the embed widget (CSS length, e.g. 480px or 100%).
    WidgetHero:
      type: object
      required:
        - title
        - description
        - cta_label
        - show_title
        - show_description
        - show_cta
        - show_image
      properties:
        title:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Welcome title when `show_title` is true. Null uses widget i18n default.
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Welcome description when `show_description` is true. Null uses widget i18n default.
        cta_label:
          type:
            - string
            - 'null'
          maxLength: 40
          description: CTA label when `show_cta` is true. Null uses widget i18n default.
        show_title:
          type: boolean
          default: true
          description: When false, the welcome title is hidden.
        show_description:
          type: boolean
          default: true
          description: When false, the welcome description is hidden.
        show_cta:
          type: boolean
          default: true
          description: When false, the CTA button is hidden.
        show_image:
          type: boolean
          default: true
          description: When false, the hero image is hidden.
        gap_after:
          type: string
          example: 1rem
          description: Space between the hero block and the message list (CSS length; 0 removes the gap).
        padding_bottom:
          type: string
          example: 1rem
          description: Padding below hero content, above the optional divider line.
        show_divider:
          type: boolean
          default: true
          description: When false, hides the divider line under the hero block.
        image_url:
          type:
            - string
            - 'null'
          description: Public path to a stored hero image (e.g. /media/hero/abc123_logo.png). Null when no image is configured.
        image_alt:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Optional alt text for the hero image.
    WidgetChat:
      type: object
      required:
        - user_avatar_mode
        - show_assistant_avatar
      properties:
        user_avatar_mode:
          type: string
          enum:
            - silhouette
            - none
          default: silhouette
          description: User message avatar display. `silhouette` shows a generic icon; `none` hides it.
        show_assistant_avatar:
          type: boolean
          default: true
          description: When false, the assistant avatar is hidden in chat bubbles.
        assistant_avatar_url:
          type:
            - string
            - 'null'
          description: Public path to a stored assistant avatar (e.g. /media/avatar/abc123_bot.png). Null uses the default silhouette.
        assistant_avatar_alt:
          type:
            - string
            - 'null'
          maxLength: 120
          description: Optional alt text for the assistant avatar image.
    WidgetLayout:
      type: object
      required:
        - max_height
        - position
        - offset_x
        - offset_y
        - floating_launcher
      properties:
        max_height:
          type: string
          description: Maximum height of the chat panel (CSS length).
          example: 32rem
        position:
          type: string
          enum:
            - inline
            - bottom_right
            - bottom_left
            - top_right
            - top_left
          default: inline
          description: Inline embeds in page flow; fixed positions pin the widget to a viewport corner.
        offset_x:
          type: integer
          minimum: 0
          maximum: 256
          default: 16
          description: Distance in pixels from the left or right viewport edge (depends on position).
        offset_y:
          type: integer
          minimum: 0
          maximum: 256
          default: 16
          description: Distance in pixels from the top or bottom viewport edge (depends on position).
        floating_launcher:
          type: boolean
          default: false
          description: When true with a fixed position, show a launcher button first; click to open the chat panel.
