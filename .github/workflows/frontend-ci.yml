name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # npm run check = lint + typecheck (all workspaces) + test (vitest,
      # currently packages/api-client only — issue #345).
      - name: Check (lint, typecheck, test)
        working-directory: frontend
        run: npm run check

      - name: Build
        working-directory: frontend
        run: npm run build
