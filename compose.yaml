services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_NAME: ${APP_NAME:-NeNe Corpus}
      NENE2_MACHINE_API_KEY: ${NENE2_MACHINE_API_KEY:-}
      PROBLEM_DETAILS_BASE_URL: ${PROBLEM_DETAILS_BASE_URL:-https://nene-corpus.dev/problems/}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_ENV: ${DB_ENV:-local}
      DB_ADAPTER: ${DB_ADAPTER:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-nene_corpus}
      DB_USER: ${DB_USER:-nene_corpus}
      DB_PASSWORD: ${DB_PASSWORD:-nene_corpus}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NENE_RECORDS_API_BASE_URL: ${NENE_RECORDS_API_BASE_URL:-}
      NENE_RECORDS_BEARER_TOKEN: ${NENE_RECORDS_BEARER_TOKEN:-}
    ports:
      - "${NENE_CORPUS_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ../NENE2:/var/www/NENE2:ro
      - composer-cache:/root/.composer/cache
    command: ["/bin/sh", "/var/www/html/docker/app/entrypoint.sh"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nene_corpus}
      MYSQL_USER: ${DB_USER:-nene_corpus}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nene_corpus}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nene_corpus_root}
    ports:
      - "${NENE_CORPUS_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  composer-cache:
